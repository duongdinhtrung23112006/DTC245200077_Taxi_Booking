<!-- User ride history page will be added here. -->
{% extends "base.html" %}{% block title %}Lịch Sử{% endblock %}{% block content %}
<h2>📋 Lịch Sử Đặt Xe Của Bạn</h2>
<table><thead><tr><th>Mã</th><th>Điểm Đón</th><th>Điểm Đến</th><th>Trạng Thái</th><th>Thời Gian</th></tr></thead>
<tbody id="historyTable"><tr><td colspan="5" style="text-align: center;">Đang tải...</td></tr></tbody></table>
<script>
async function loadHistory() {
    const res = await fetch('/api/rides'); const result = await res.json();
    const tbody = document.getElementById('historyTable'); tbody.innerHTML = '';
    if (result.data && result.data.length > 0) {
        result.data.forEach(r => { tbody.innerHTML += `<tr><td>#${r.id}</td><td>${r.pickup_location}</td><td>${r.dropoff_location}</td><td><span class="badge">${r.status}</span></td><td>${r.created_at}</td></tr>`; });
    } else { tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Chưa có chuyến xe nào</td></tr>'; }
}
loadHistory();
</script>
{% endblock %}
