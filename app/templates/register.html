{% extends "base.html" %}{% block title %}Đăng Ký{% endblock %}{% block content %}
<h2>📝 Đăng Ký Tài Khoản</h2>
<form method="POST">
    <div class="form-group"><label>Tên đăng nhập:</label><input type="text" name="username" required></div>
    <div class="form-group"><label>Mật khẩu:</label><input type="password" name="password" required></div>
    <button type="submit" class="btn-primary">Đăng Ký</button>
</form>
<p style="margin-top: 15px; text-align: center;">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
{% endblock %}
