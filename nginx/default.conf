#Đây là file cấu hình chính cho Nginx Reverse Proxy. Nó đóng vai trò như một "lính gác cổng" đứng ở tuyến đầu: nhận mọi yêu cầu
# từ người dùng truy cập qua cổng 80, sau đó âm thầm chuyển tiếp (proxy) các request đó vào bên trong container ứng dụng Flask 
#(http://web:5000). Đồng thời, nó còn chịu trách nhiệm thiết lập các tiêu đề bảo mật (Security Headers) để chống lại các cuộc 
#tấn công web phổ biến như Clickjacking hay XSS.

server {
    listen 80; # Lắng nghe mọi kết nối truy cập vào cổng 80 của Nginx (cổng web thông thường HTTP)
    server_name localhost; # Định danh tên miền hoặc IP của máy chủ phục vụ (ở đây chạy dưới local)

    # Cấu hình giới hạn dung lượng file tối đa được phép tải lên qua HTTP (tránh bị tấn công tràn bộ nhớ bằng file lớn)
    client_max_body_size 10M;

    # --- CÁC THIẾT LẬP BẢO MẬT (SECURITY HEADERS) ---
    # Chống tấn công nhúng iframe độc hại (Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Ngăn trình duyệt tự động đoán kiểu MIME của file (chống tấn công MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    # Bật tính năng bảo vệ chống XSS sẵn có của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # --- KHU VỰC ĐỊNH TUYẾN (ROUTING) ---
    location / {
        proxy_pass http://web:5000; # Chuyển tiếp toàn bộ request nhận được từ người dùng vào container Flask (tên service là 'web', cổng 5000)
        
        # Nhúng các file tham số cấu hình proxy chuẩn (giúp giữ nguyên thông tin IP thực của khách hàng, kiểu kết nối...)
        include /etc/nginx/proxy_params.conf;

        # Cấu hình thời gian chờ kết nối (timeout) giữa Nginx và container app
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}