#Đây là tập hợp các tham số tiêu chuẩn dùng để chuyển tiếp thông tin từ Nginx (Reverse Proxy) vào bên trong ứng dụng backend 
#(Flask). Nó giúp ứng dụng bên trong biết được địa chỉ IP thực sự của người dùng, giao thức họ đang dùng (HTTP/HTTPS) 
#thay vì chỉ nhìn thấy IP của Nginx, đồng thời quản lý các kết nối mạng ngầm (Keep-alive, Buffering) để tối ưu hiệu suất 
#truyền tải dữ liệu.

# Định nghĩa lại các tiêu đề HTTP gửi kèm từ Nginx vào ứng dụng backend
proxy_set_header Host $http_host;                  # Giữ nguyên tên miền/host gốc mà người dùng đang truy cập
proxy_set_header X-Real-IP $remote_addr;           # Truyền địa chỉ IP thực của người dùng qua backend để phục vụ việc ghi log hoặc bảo mật
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Lưu lại chuỗi các IP trung gian nếu qua nhiều lớp proxy
proxy_set_header X-Forwarded-Proto $scheme;        # Truyền giao thức gốc mà client dùng (http hoặc https)

# Quản lý bộ nhớ đệm (buffer) cho dữ liệu phản hồi từ ứng dụng backend trả về
proxy_buffering on;                                # Bật tính năng đệm dữ liệu để tối ưu tốc độ truyền tải
proxy_buffer_size 4k;                              # Kích thước vùng đệm cho phần tiêu đề (header) phản hồi đầu tiên
proxy_buffers 8 4k;                                # Số lượng và kích thước các vùng đệm tiếp theo cho nội dung trả về

# Cấu hình tối ưu kết nối mạng ngầm (Keep-Alive) giữa Nginx và backend
proxy_http_version 1.1;                            # Sử dụng HTTP phiên bản 1.1 để hỗ trợ kết nối liên tục (keep-alive)
proxy_set_header Connection "";                    # Xóa header kết nối cũ để Nginx tự động tái sử dụng kết nối mạng sẵn có, giảm độ trễ
